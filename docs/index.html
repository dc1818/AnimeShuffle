<!doctype html>
<html lang="en" data-hosting="pages">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Anime Shuffle — Anime recommendations & discovery</title>
    <meta
      name="description"
      content="Find your next anime with recommendations that learn from what you like. Discover shows, build a watchlist, and optionally connect MyAnimeList."
    />
    <link rel="canonical" href="https://animeshuffle.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anime Shuffle" />
    <meta property="og:title" content="Anime Shuffle — Find your next anime" />
    <meta
      property="og:description"
      content="Anime recommendations based on what you enjoy. Discover shows, react to picks, and build your watchlist without scoring every anime."
    />
    <meta property="og:url" content="https://animeshuffle.com/" />
    <meta
      property="og:image"
      content="https://animeshuffle.com/assets/app-icon-512.png"
    />
    <meta property="og:image:alt" content="Anime Shuffle app icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0d151b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anime Shuffle" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/app-icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- React owns everything inside this root. CSS remains a separate stylesheet. -->
    <div id="root">
      <div class="service-start" role="status">Loading Anime Shuffle…</div>
    </div>
    <noscript
      >Anime Shuffle helps you discover anime and build a watchlist from what
      you enjoy. Enable JavaScript to use the app, or
      <a href="./how-it-works.html">read how Anime Shuffle works</a>.</noscript
    >
    <script type="module" src="./app.js"></script>
  </body>
</html>
