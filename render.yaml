# Paid compute and persistent disk. Review Render's price before deploying.
# One instance only: account storage and in-memory sessions are not distributed.
services:
  - type: web
    name: anime-shuffle
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: anime-shuffle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: ANIME_SHUFFLE_DATA_DIR
        value: /var/data/anime-shuffle
      - key: MAL_CLIENT_ID
        sync: false
      - key: MAL_CLIENT_SECRET
        sync: false
